name: holton.xyz CI/CD Pipeline

permissions:
  contents: write
  packages: write
  pull-requests: read

on:
  push:
    branches:
      - main
      - develop
      - 'Release_*'

jobs:
  tag-main-holton-xyz:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    environment: holton.xyz
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN || github.token }}

      - name: Tag on Merge for holton.xyz to Main
        id: create_tag
        run: |
          export GITHUB_TAG_HOLTON_XYZ=$(date "+%Y.%m.%d.%H%M%S-main")
          git config --global user.email "jordan@jordanholton.com"
          git config --global user.name "Jordan Holton"
          git tag $GITHUB_TAG_HOLTON_XYZ
          git push origin $GITHUB_TAG_HOLTON_XYZ
          echo "tag=$GITHUB_TAG_HOLTON_XYZ" >> $GITHUB_OUTPUT

  tag-develop-holton-xyz:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest
    environment: holton.xyz
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN || github.token }}

      - name: Tag on Merge for holton.xyz to Develop
        id: create_tag
        run: |
          export GITHUB_TAG_HOLTON_XYZ=$(date "+%Y.%m.%d.%H%M%S-develop")
          git config --global user.email "jordan@jordanholton.com"
          git config --global user.name "Jordan Holton"
          git tag $GITHUB_TAG_HOLTON_XYZ
          git push origin $GITHUB_TAG_HOLTON_XYZ
          echo "tag=$GITHUB_TAG_HOLTON_XYZ" >> $GITHUB_OUTPUT

  tag-release-holton-xyz:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/Release_')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.base.ref, 'HOLTONXYZ_Release_'))
    runs-on: ubuntu-latest
    environment: holton.xyz
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN || github.token }}

      - name: Tag on Merge for holton.xyz to Release
        id: create_tag
        run: |
          export GITHUB_TAG_HOLTON_XYZ=$(date "+%Y.%m.%d.%H%M%S-release")
          git config --global user.email "jordan@jordanholton.com"
          git config --global user.name "Jordan Holton"
          git tag $GITHUB_TAG_HOLTON_XYZ
          git push origin $GITHUB_TAG_HOLTON_XYZ
          echo "tag=$GITHUB_TAG_HOLTON_XYZ" >> $GITHUB_OUTPUT

  build-and-deploy-main:
    needs: [tag-main-holton-xyz]
    if: needs.tag-main-holton-xyz.outputs.tag_created != ''
    runs-on: ubuntu-latest
    environment: holton.xyz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.x'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Use created tag
        id: extract_tag
        run: |
          echo "tag=${{ needs.tag-main-holton-xyz.outputs.tag_created }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT_TOKEN || github.token }}

      - name: Ensure PHP base image exists
        run: |
          # Build and publish the base image named in k8s.dockerfile the first time it's referenced.
          BASE_IMAGE=$(sed -n 's/^FROM //p' .docker/php/k8s.dockerfile | head -1)
          if docker manifest inspect "$BASE_IMAGE" > /dev/null 2>&1; then
            echo "Base image $BASE_IMAGE already published."
          else
            echo "Building missing base image $BASE_IMAGE..."
            docker build . -f .docker/php/k8sbase.dockerfile -t "$BASE_IMAGE"
            docker push "$BASE_IMAGE"
          fi

      - name: Docker Build and Push
        run: |
          # Install dependencies and build assets
          npm install
          npm run build

          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/holton.xyz"
          TAG="${{ steps.extract_tag.outputs.tag }}"

          # Build images
          docker build . -f .docker/nginx/k8s.dockerfile \
            -t "$IMAGE_BASE/holton-xyz-nginx:$TAG" \
            -t "$IMAGE_BASE/holton-xyz-nginx:latest"

          docker build . -f .docker/php/k8s.dockerfile \
            -t "$IMAGE_BASE/holton-xyz-php:$TAG" \
            -t "$IMAGE_BASE/holton-xyz-php:latest"

          # Push images
          docker push "$IMAGE_BASE/holton-xyz-nginx:$TAG"
          docker push "$IMAGE_BASE/holton-xyz-nginx:latest"

          docker push "$IMAGE_BASE/holton-xyz-php:$TAG"
          docker push "$IMAGE_BASE/holton-xyz-php:latest"

  build-and-deploy-nashville:
    needs: [tag-develop-holton-xyz]
    if: needs.tag-develop-holton-xyz.outputs.tag_created != ''
    runs-on: ubuntu-latest
    environment: holton.xyz
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.x'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Use created tag
        id: extract_tag
        run: |
          echo "tag=${{ needs.tag-develop-holton-xyz.outputs.tag_created }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT_TOKEN || github.token }}

      - name: Ensure PHP base image exists
        run: |
          # Build and publish the base image named in k8s.dockerfile the first time it's referenced.
          BASE_IMAGE=$(sed -n 's/^FROM //p' .docker/php/k8s.dockerfile | head -1)
          if docker manifest inspect "$BASE_IMAGE" > /dev/null 2>&1; then
            echo "Base image $BASE_IMAGE already published."
          else
            echo "Building missing base image $BASE_IMAGE..."
            docker build . -f .docker/php/k8sbase.dockerfile -t "$BASE_IMAGE"
            docker push "$BASE_IMAGE"
          fi

      - name: Docker Build and Push
        run: |
          # Install dependencies and build assets
          npm install
          npm run build

          IMAGE_BASE="ghcr.io/${{ github.repository_owner }}/holton.xyz"
          TAG="${{ steps.extract_tag.outputs.tag }}"

          # Build images
          docker build . -f .docker/nginx/k8s.dockerfile \
            -t "$IMAGE_BASE/holton-xyz-nginx:$TAG" \
            -t "$IMAGE_BASE/holton-xyz-nginx:latest"

          docker build . -f .docker/php/k8s.dockerfile \
            -t "$IMAGE_BASE/holton-xyz-php:$TAG" \
            -t "$IMAGE_BASE/holton-xyz-php:latest"

          # Push images
          docker push "$IMAGE_BASE/holton-xyz-nginx:$TAG"
          docker push "$IMAGE_BASE/holton-xyz-nginx:latest"

          docker push "$IMAGE_BASE/holton-xyz-php:$TAG"
          docker push "$IMAGE_BASE/holton-xyz-php:latest"
